<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Manage your email subscriptions and preferences with WeScale Emailer." />
  <meta name="theme-color" content="#0f8a3d" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preload" href="/brand/fonts/poppins-regular.woff2" as="font" type="font/woff2" crossorigin />
  <title>WeScale Emailer | Email preferences</title>
  <style>
    body { margin: 0; background: #f5f5f4; color: #111114; }
    .preload-splash { min-height: 100dvh; display: grid; place-items: center; }
    .preload-splash-content { text-align: center; padding: 2rem; }
    .preload-logo { width: 10rem; height: auto; }
    .preload-progress { width: 7rem; height: 3px; margin: 2rem auto 0; overflow: hidden; background: #dff1e5; border-radius: 3px; }
    .preload-progress::after { content: ''; display: block; width: 50%; height: 100%; background: #0f8a3d; animation: loading 1.2s infinite ease-in-out; }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(200%); } }
    @media (prefers-reduced-motion: reduce) { .preload-progress::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="preload-splash" role="status" aria-label="Loading email preferences">
      <div class="preload-splash-content">
        <img class="preload-logo" src="/logo.png" alt="WeScale" />
        <div class="preload-progress" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script>
    // Keep runtime configuration on its server route when Vite applies the asset base.
    document.write('<script src="/config.js"><\/script>');
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
