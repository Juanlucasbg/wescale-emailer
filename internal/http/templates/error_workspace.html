<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeScale | Workspace Not Found</title>
    <link rel="icon" href="/console/favicon-32x32.png" type="image/png">
    <style>
        @font-face { font-family: "Poppins"; src: url("/console/brand/fonts/poppins-regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
        a:focus-visible { outline: 2px solid #0f8a3d; outline-offset: 4px; }
        .brand-logo { width: 168px; height: auto; margin: 0 auto 2rem; display: block; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #111114;
            background: #f5f5f4;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
        }
        .error-container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            border: 1px solid #e7e7e4;
            box-shadow: 0 12px 32px rgba(17,17,20,0.04);
            max-width: 500px;
        }
        h1 {
            font-size: 4rem;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #111114;
        }
        p {
            color: #52525a;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #0f8a3d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        a:hover {
            background: #27770b;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img class="brand-logo" src="/console/logo.png" alt="WeScale">
        <h1>⚠️</h1>
        <h2>Workspace Not Found</h2>
        <p>This domain is not configured for any workspace. Please check your DNS settings or contact support.</p>
        <a href="/console">Go to Console</a>
    </div>
</body>
</html>
